<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="/src/front/css/main.css">

  <title>Pagar | 4Bit</title>

  <script type="module" src="/src/front/js/main.js"></script>
  <script type="module" src="/src/front/js/checkout.js"></script>
</head>
<body>
  <div id="header-store"></div>
  <div id="carrito"></div>

  <main class="container py-4">
    <h1 class="mb-4 text-center">Finalizar compra</h1>

    <div class="row g-4">
      <!-- Método de pago -->
      <section class="col-lg-7">
        <div class="card shadow-sm border-0 p-4">
          <h2 class="h4 mb-4">Método de pago</h2>

          <form id="checkout-form" class="d-grid gap-4">
            <div>
              <label class="form-label fw-bold">Selecciona un método</label>

              <div class="d-grid gap-2">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="metodoPago" id="tarjeta" value="tarjeta" checked>
                  <label class="form-check-label" for="tarjeta">Tarjeta</label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="radio" name="metodoPago" id="sinpe" value="sinpe">
                  <label class="form-check-label" for="sinpe">SINPE Móvil</label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="radio" name="metodoPago" id="paypal" value="paypal">
                  <label class="form-check-label" for="paypal">PayPal</label>
                </div>
              </div>
            </div>

            <div id="payment-fields">
              <div class="row g-3">
                <div class="col-md-12">
                  <label for="nombreTitular" class="form-label">Nombre del titular</label>
                  <input type="text" class="form-control" id="nombreTitular" placeholder="Nombre completo">
                </div>

                <div class="col-md-12">
                  <label for="numeroTarjeta" class="form-label">Número de tarjeta</label>
                  <input type="text" class="form-control" id="numeroTarjeta" placeholder="0000 0000 0000 0000">
                </div>

                <div class="col-md-6">
                  <label for="fechaVencimiento" class="form-label">Vencimiento</label>
                  <input type="text" class="form-control" id="fechaVencimiento" placeholder="MM/AA">
                </div>

                <div class="col-md-6">
                  <label for="cvv" class="form-label">CVV</label>
                  <input type="text" class="form-control" id="cvv" placeholder="123">
                </div>
              </div>
            </div>

            <div class="d-flex gap-3 flex-wrap">
              <a href="/src/front/pages/catalogo.html" class="btn btn-outline-secondary">
                Volver al catálogo
              </a>

              <button type="submit" class="btn btn-success">
                Pagar ahora
              </button>
            </div>
          </form>
        </div>
      </section>

      <!-- Resumen -->
      <aside class="col-lg-5">
        <div class="card shadow-sm border-0 p-4">
          <h2 class="h4 mb-4">Resumen de compra</h2>

          <div id="checkout-items" class="d-grid gap-3 mb-4"></div>

          <div id="checkout-totals" class="border-top pt-3"></div>
        </div>
      </aside>
    </div>
  </main>

  <div id="footer"></div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</body>
</html>
