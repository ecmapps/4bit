<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/src/front/css/main.css">
  <title>4Bit - Producto</title>

  <script type="module" src="/src/front/js/main.js"></script>
</head>
<body class="d-flex flex-column min-vh-100" style="background:#1a1535;">

  <div id="header-store"></div>
  <div id="carrito"></div>

  <main class="product-section container my-4">
    <div class="product-card">

      <div class="product-image">
        <img id="producto-imagen" src="" alt="Imagen del producto"/>
      </div>

      <div class="product-info">
        <h1 id="producto-nombre"></h1>
        <p class="description" id="producto-descripcion"></p>
        <div class="price" id="producto-precio"></div>

        <div class="quantity-wrap">
          <button class="qty-btn" onclick="changeQty(-1)">−</button>
          <input class="qty-input" type="number" id="qty" value="1" min="1"/>
          <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>

        <div class="d-flex gap-3 justify-content-center flex-wrap">
          <button class="btn-comprar" id="btn-comprar">Comprar Ahora</button>
          <button class="btn-carrito" id="btn-carrito">Agregar al carrito</button>
          <a href="/src/front/pages/catalogo.html" class="btn btn-outline-light">Volver al catálogo</a>
        </div>
      </div>

    </div>
  </main>

  <div class="product-tabs">
    <a href="#" class="tab-link active">Descripcion</a>
    <a href="#" class="tab-link">Requerimientos</a>
    <a href="#" class="tab-link">Reseñas</a>
  </div>

  <div class="container my-4">
    <div id="tab-descripcion">
      <p id="producto-so" style="color:rgba(255,255,255,0.6);"></p>
      <p id="producto-lanzamiento" style="color:rgba(255,255,255,0.6);"></p>
      <p id="producto-categoria" style="color:rgba(255,255,255,0.6);"></p>
    </div>
  </div>

  <div class="protected-banner">
    <svg viewBox="0 0 24 24">
      <path d="M12 2L3 6v6c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V6L12 2z"/>
    </svg>
    <h2>Compra 100% protegida</h2>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  <script type="module">
    import { abrirCarrito, initCarrito, agregarProductoAlCarrito } from '/src/front/js/carrito.js';
    import { ProductoPorId } from '/src/front/js/productos.js';

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        initCarrito();
      }, 100);
    });

    let productoActual = null;

    function formatearCRC(valor) {
      return `₡${Number(valor).toLocaleString('es-CR', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })}`;
    }

    function obtenerPrecioFinal(producto) {
      return producto.precio_en_descuento ?? producto.precio;
    }

    function agregarAlCarrito(producto, cantidad = 1) {
  agregarProductoAlCarrito(producto, cantidad);
}

    async function cargarProducto() {
      try {
        const producto = await ProductoPorId(id);

        if (!producto) {
          document.querySelector('.product-section').innerHTML = `
            <div class="alert alert-danger text-center">
              Producto no encontrado.
            </div>
          `;
          return;
        }

        productoActual = producto;

        document.title = `4Bit - ${producto.nombre}`;

        const img = document.getElementById('producto-imagen');
        img.src = producto.imagen || producto.thumbnail;
        img.alt = producto.nombre;
        img.onerror = () => { img.src = producto.thumbnail || '/assets/Logo_4bit.webp'; };

        document.getElementById('producto-nombre').textContent = producto.nombre;
        document.getElementById('producto-descripcion').textContent = producto.descripcion_breve;

        const precioEl = document.getElementById('producto-precio');
        if (producto.precio_en_descuento) {
          precioEl.innerHTML = `
            <span style="text-decoration:line-through; opacity:0.5; font-size:1.2rem;">
              ${formatearCRC(producto.precio)}
            </span>
            <span style="color:#61D6EA;">
              ${formatearCRC(producto.precio_en_descuento)}
            </span>
          `;
        } else {
          precioEl.textContent = formatearCRC(obtenerPrecioFinal(producto));
        }

        document.getElementById('producto-so').textContent =
          `Sistemas operativos: ${producto.sistema_operativo.join(', ')}`;

        document.getElementById('producto-lanzamiento').textContent =
          `Año de lanzamiento: ${producto.año_de_lanzamiento}`;

        document.getElementById('producto-categoria').textContent =
          `Categoría: ${producto.categoria}`;
      } catch (error) {
        console.error('Error cargando producto:', error);
        document.querySelector('.product-section').innerHTML = `
          <div class="alert alert-danger text-center">
            No se pudo cargar el producto.
          </div>
        `;
      }
    }

    cargarProducto();

    window.changeQty = function(delta) {
      const input = document.getElementById('qty');
      const val = parseInt(input.value || 1) + delta;
      if (val >= 1) input.value = val;
    };

    document.querySelectorAll('.tab-link').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });

    document.getElementById('btn-carrito')?.addEventListener('click', () => {
      if (!productoActual) return;

      const cantidad = parseInt(document.getElementById('qty').value) || 1;
      agregarAlCarrito(productoActual, cantidad);

      setTimeout(() => {
        initCarrito();
        abrirCarrito();
      }, 50);
    });

    document.getElementById('btn-comprar')?.addEventListener('click', () => {
      if (!productoActual) return;
      const cantidad = parseInt(document.getElementById('qty').value) || 1;
      agregarAlCarrito(productoActual, cantidad);
      window.location.href = '/src/front/pages/carrito.html';
    });
  </script>
</body>
</html>
