<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <link rel="stylesheet" href="../css/main.css">
    <title>4Bit - Producto</title>
    <script src="../js/main.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">

    <div id="header"></div>

    <!-- Search Bar -->
    <div class="search-bar">
        <label>Buscar</label>
        <input type="text" placeholder=""/>
        <div class="wallet">
            <div class="wallet-icon">💰</div>
            ₡ 6,985.41
        </div>
    </div>

    <!-- Producto -->
    <main class="product-section container my-4">
        <div class="product-card">

            <!-- Imagen -->
            <div class="product-image">
                <svg viewBox="0 0 88 88" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0 12.402l35.687-4.86.016 34.423-35.67.203zm35.67 33.529l.028 34.453L.028 75.48.026 45.7zm4.326-39.025L87.314 0v41.527l-47.318.376zm47.329 39.349l-.011 41.34-47.318-6.678-.066-34.739z"/>
                </svg>
                <span class="win-label">Windows 11</span>
            </div>

            <!-- Info -->
            <div class="product-info">
                <h1>Windows 11 pro retail CD Key</h1>
                <p class="description">
                    Grab your Windows 11 Pro Key and move to the modern standard of computing. This
                    professional license offers a clean interface…
                </p>
                <div class="price">2.735.75 CRC</div>

                <div class="quantity-wrap">
                    <button class="qty-btn" onclick="changeQty(-1)">−</button>
                    <input class="qty-input" type="number" id="qty" value="1" min="1"/>
                    <button class="qty-btn" onclick="changeQty(1)">+</button>
                </div>

                <div class="d-flex gap-3 justify-content-center">
                    <button class="btn-comprar">Comprar Ahora</button>
                    <button class="btn-carrito">Agregar al carrito</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Tabs -->
    <div class="product-tabs">
        <a href="#" class="tab-link active">Descripcion</a>
        <a href="#" class="tab-link">Requerimientos</a>
        <a href="#" class="tab-link">Reseñas</a>
    </div>

    <!-- Banner protegido -->
    <div class="protected-banner">
        <svg viewBox="0 0 24 24">
            <path d="M12 2L3 6v6c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V6L12 2z"/>
        </svg>
        <h2>Compra 100% protegida</h2>
    </div>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        function changeQty(delta) {
            const input = document.getElementById('qty');
            const val = parseInt(input.value) + delta;
            if (val >= 1) input.value = val;
        }

        document.querySelectorAll('.tab-link').forEach(link => {
            link.addEventListener('click', e => {
                e.preventDefault();
                document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            });
        });
    </script>
</body>
</html>
