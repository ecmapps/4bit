<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/src/front/css/main.css">
    <title>4Bit - Producto</title>
    <script type="module" src="/src/front/js/main.js"></script>
</head>
<body class="d-flex flex-column min-vh-100" style="background:#1a1535;">

    <div id="header-store"></div>
  <div id="carrito"></div>

    <!-- Search Bar -->
    <div class="search-bar">
        <label>Buscar</label>
        <input type="text" placeholder=""/>
        <div class="wallet">
            <div class="wallet-icon">💰</div>
            ₡ 6,985.41
        </div>
    </div>

    <!-- Producto -->
    <main class="product-section container my-4">
        <div class="product-card">

            <!-- Imagen -->
            <div class="product-image">
                <img id="producto-imagen" src="" alt="Imagen del producto"/>
            </div>

            <!-- Info -->
            <div class="product-info">
                <h1 id="producto-nombre"></h1>
                <p class="description" id="producto-descripcion"></p>
                <div class="price" id="producto-precio"></div>

                <div class="quantity-wrap">
                    <button class="qty-btn" onclick="changeQty(-1)">−</button>
                    <input class="qty-input" type="number" id="qty" value="1" min="1"/>
                    <button class="qty-btn" onclick="changeQty(1)">+</button>
                </div>

                <div class="d-flex gap-3 justify-content-center">
                    <button class="btn-comprar">Comprar Ahora</button>
                    <button class="btn-carrito">Agregar al carrito</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Tabs -->
    <div class="product-tabs">
        <a href="#" class="tab-link active">Descripcion</a>
        <a href="#" class="tab-link">Requerimientos</a>
        <a href="#" class="tab-link">Reseñas</a>
    </div>

    <!-- Tab Content -->
    <div class="container my-4">
        <div id="tab-descripcion">
            <p id="producto-so" style="color:rgba(255,255,255,0.6);"></p>
        </div>
    </div>

    <!-- Banner protegido -->
    <div class="protected-banner">
        <svg viewBox="0 0 24 24">
            <path d="M12 2L3 6v6c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V6L12 2z"/>
        </svg>
        <h2>Compra 100% protegida</h2>
    </div>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module">
        import { Productos } from '../js/productos.js';

        // Obtener el id del producto desde la URL: producto.html?id=0
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get('id')) || 0;

        async function cargarProducto() {
            const data = await Productos();
            if (!data || !data.productos) return;

            const producto = data.productos[id];
            if (!producto) return;

            // Título de la página
            document.title = `4Bit - ${producto.nombre}`;

            // Imagen
            const img = document.getElementById('producto-imagen');
             img.src = producto.imagen;
            img.alt = producto.nombre;
            img.onerror = () => { img.src = producto.thumbnail; };

            // Texto
            document.getElementById('producto-nombre').textContent = producto.nombre;
            document.getElementById('producto-descripcion').textContent = producto.descripcion_breve;

            // Precio con descuento
            const precioEl = document.getElementById('producto-precio');
            if (producto.precio_en_descuento) {
                precioEl.innerHTML = `
                    <span style="text-decoration:line-through; opacity:0.5; font-size:1.2rem;">
                        ₡${producto.precio.toLocaleString()}
                    </span>
                    <span style="color:#61D6EA;">
                        ₡${producto.precio_en_descuento.toLocaleString()} CRC
                    </span>
                `;
            } else {
                precioEl.textContent = `₡${producto.precio.toLocaleString()} CRC`;
            }

            // Sistemas operativos
            document.getElementById('producto-so').textContent =
                `Sistemas operativos: ${producto.sistema_operativo.join(', ')}`;
        }

        cargarProducto();

        // Cantidad
        window.changeQty = function(delta) {
            const input = document.getElementById('qty');
            const val = parseInt(input.value) + delta;
            if (val >= 1) input.value = val;
        }

        // Tabs
        document.querySelectorAll('.tab-link').forEach(link => {
            link.addEventListener('click', e => {
                e.preventDefault();
                document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            });
        });
    </script>
</body>
</html>
