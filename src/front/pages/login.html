<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/main.css">
    <title>Login | 4Bit</title>
    <script src="../js/main.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100" style="background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);">

    <div id="header"></div>

    <!-- Auth Container -->
    <div class="flex-grow-1 d-flex align-items-center justify-content-center px-3">
        <div class="w-100" style="max-width: 450px;">

            <!-- Login Card -->
            <div class="card border-0 shadow-lg" id="login-card" style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);">
                <div class="card-body p-5">

                    <!-- Logo -->
                    <div class="text-center mb-4">
                        <img src="/assets/Logo_4bit.webp" alt="4bit logo" style="height: 60px; width: auto;">
                    </div>

                    <!-- Title -->
                    <h2 class="text-center fw-bold mb-1" style="color: #312e81;">Iniciar Sesión</h2>
                    <p class="text-center text-muted mb-4">Accede a tu cuenta 4Bit</p>

                    <!-- Form -->
                    <form id="login-form">
                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold" style="color: #111827;">Email</label>
                            <input type="email" class="form-control form-control-lg" id="email" placeholder="tu@email.com" required>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold" style="color: #111827;">Contraseña</label>
                            <input type="password" class="form-control form-control-lg" id="password" placeholder="••••••••" required>
                        </div>

                        <!-- Login Button -->
                        <button type="submit" class="btn btn-lg w-100 fw-bold text-white rounded-2" style="background: linear-gradient(90deg, #61D6EA 0%, #3B4D78 13%, #302657 100%);">
                            INICIAR SESIÓN
                        </button>
                    </form>

                    <!-- Register Link -->
                    <p class="text-center mt-4" style="color: #6b7280;">
                        ¿No tienes cuenta? 
                        <a href="registro.html" class="text-decoration-none fw-bold" style="color: #8B5CF6;">Regístrate aquí</a>
                    </p>

                </div>
            </div>

        </div>
    </div>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module">
        import { auth } from '../js/auth.js';

        // LOGIN
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            try {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const user = auth.login(email, password);
                
                alert(`¡Bienvenido ${user.fullname}!`);
                
                // Limpiar formulario y redirigir
                document.getElementById('login-form').reset();
                setTimeout(() => {
                    window.location.href = '/src/front/pages/inicio.html';
                }, 1500);
            } catch (error) {
                alert('Error al iniciar sesión: ' + error.message);
            }
        });
    </script>
</body>
</html>
