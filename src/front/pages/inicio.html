<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/main.css">
    <title>Inicio 4Bit</title>
    <script src="../js/main.js" defer></script>


</head>
<body>

  <div id="header"></div>
  <div id="carrito"></div>

<!-- Barra superior: búsqueda + saldo -->
<nav class="navbar navbar-expand navbar-dark" style="background: linear-gradient(90deg, #6b48ff, #9f7aea);">
  <div class="container-fluid px-4 px-lg-5">
    <!-- Buscar a la izquierda + input -->
    <div class="d-flex align-items-center flex-grow-1">
      <span class="text-white fw-bold me-3 fs-5">Buscar</span>
      <input class="form-control rounded-pill bg-white bg-opacity-25 border-0 text-white placeholder-white" 
             type="search" placeholder="Buscar productos..." aria-label="Buscar">
    </div>

    <!-- Saldo fijo con icono de carrito -->
    <div class="d-flex align-items-center text-white fw-bold">
      <i class="bi bi-cart-fill me-2 fs-5"></i>
      ₡ 12.500,00
    </div>
  </div>
</nav>

  <section class="text-white position-relative mx-3 mx-lg-5 my-4 rounded-4 shadow-xl" 
           style="min-height: 15vh; overflow: hidden; background: transparent;">

    <div class="container-fluid h-100 px-4 px-lg-5 py-4 py-lg-3 position-relative d-flex flex-column">

      <!-- Fondo + overlay -->
      <div class="position-absolute top-0 start-0 w-100 h-100 rounded-4 shadow-lg"
           style="background-image: url('/assets/Inicio.webp');
                  background-size: cover;
                  background-position: center 50%;  
                  background-repeat: no-repeat;
                  border-radius: 1.5rem;">

        <div class="position-absolute top-0 start-0 w-100 h-100 rounded-4"
             style="border-radius: 1.5rem;"></div>
      </div>

      <!-- Contenido -->
      <div class="row h-100 position-relative z-1 align-items-center">

        <!-- Botones -->
        <div class="col-12 col-lg-5 col-xl-5 mb-4 mb-lg-0 d-flex justify-content-center justify-content-lg-start">
          <div class="d-flex flex-column flex-lg-row gap-3 gap-lg-4">
            <a href="#" class="btn btn-lg fw-bold shadow-lg py-3 px-4 fs-5 text-white"
               style="background: linear-gradient(90deg, #A21CAF, #4FD1E8); border: none; min-width: 210px;">
              VER CATÁLOGO
            </a>
            <a href="#" class="btn btn-lg fw-bold shadow-lg py-3 px-4 fs-5 text-white"
               style="background: linear-gradient(90deg, #A21CAF, #4FD1E8); border: none; min-width: 210px;">
              REGISTRARSE
            </a>
          </div>
        </div>

        <!-- Título y descripción -->
        <div class="col-12 col-lg-7 col-xl-7 text-center text-lg-end">
          <h1 class="display-4 fw-bold mb-3 lh-1" style="text-shadow: 0 4px 25px rgba(0,0,0,0.7);">
            Compra fácil,<br>segura y rápida
          </h1>
          <p class="lead fs-5 opacity-90 mb-0" style="max-width: 950px; margin-left: auto; margin-right: auto;">
            Productos por categorías, búsqueda avanzada y<br>pago simulado
          </p>
        </div>
      </div>

      <!-- Barra de categorías con dropdowns -->
      <div class="mt-auto position-relative bottom-0 start-0 end-0 pb-5 pb-lg-5 px-4 px-lg-4 z-2"
          style="background: linear-gradient(to bottom, rgba(30, 20, 80, 0.45), rgba(50, 40, 130, 0.35));
                  backdrop-filter: blur(10px);
                  margin-left: -3rem; margin-right: -3rem;
                  border-radius: 0 0 1.5rem 1.5rem;
                  border-top: 1px solid rgba(255,255,255,0.15);">

        <div class="row g-3 m-0 justify-content-center align-items-center position-relative z-1">
          
          

        </div>
      </div>

    </div>
  </section>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

<script type="module">
  import { Productos } from '../js/productos.js';

  document.addEventListener('DOMContentLoaded', async () => {
    const datos = await Productos();
    if (datos && datos.productos) {
      renderizarCategorias(datos.productos);
    } else {
      console.error("No se pudieron cargar los productos");
    }
  });

  function renderizarCategorias(productos) {
    // 1. Agrupar productos por categoría
    const categoriasMap = {};

    productos.forEach(prod => {
      const cat = prod.categoria;
      if (!categoriasMap[cat]) {
        categoriasMap[cat] = [];
      }
      categoriasMap[cat].push(prod.nombre);
    });

    // 2. Obtener las categorías únicas y ordenarlas (opcional)
    const categorias = Object.keys(categoriasMap).sort();

    // 3. Limpiar el contenedor de categorías
    const contenedor = document.querySelector('.row.g-3.m-0.justify-content-center');
    if (!contenedor) {
      console.error("No se encontró el contenedor de categorías");
      return;
    }
    contenedor.innerHTML = '';

    // 4. Crear una pastilla + dropdown por cada categoría
    categorias.forEach(cat => {
      const col = document.createElement('div');
      col.className = 'col-6 col-sm-4 col-md-3 col-lg-2';

      const productosLista = categoriasMap[cat].map(nombre => 
        `<li><a class="dropdown-item" href="#">${nombre}</a></li>`
      ).join('');

      col.innerHTML = `
        <div class="dropdown text-center">
          <button class="btn fw-semibold fs-6 shadow dropdown-toggle w-100"
                  type="button" data-bs-toggle="dropdown" aria-expanded="false"
                  style="background: linear-gradient(135deg, rgba(124,58,237,0.5), rgba(167,139,250,0.5)); 
                        backdrop-filter: blur(8px); 
                        border: 1px solid rgba(255,255,255,0.3); 
                        color: white; 
                        border-radius: 12px;">
            ${cat}
          </button>
          <ul class="dropdown-menu dropdown-menu-dark">
            ${productosLista}
          </ul>
        </div>
      `;

      contenedor.appendChild(col);
    });
  }
</script>

</html>
