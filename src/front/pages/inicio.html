<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />

  <link rel="stylesheet" href="/src/front/css/main.css">

  <title>Inicio 4Bit</title>

  <script type="module" src="/src/front/js/main.js"></script>
  <script type="module" src="/src/front/js/inicio-productos.js"></script>
</head>
<body>

  <div id="header-store"></div>
  <div id="carrito"></div>

  <!-- HERO -->
  <section
    class="text-white position-relative mx-3 mx-lg-5 my-4 rounded-4 shadow-xl"
    style="min-height: 38vh; overflow: hidden; background: transparent;"
  >
    <div class="container-fluid h-100 px-4 px-lg-5 py-4 py-lg-3 position-relative d-flex flex-column">

      <div
        class="position-absolute top-0 start-0 w-100 h-100 rounded-4 shadow-lg"
        style="background-image: url('/assets/Inicio.webp');
               background-size: cover;
               background-position: center 50%;
               background-repeat: no-repeat;
               border-radius: 1.5rem;"
      >
        <div
          class="position-absolute top-0 start-0 w-100 h-100 rounded-4"
          style="border-radius: 1.5rem;"
        ></div>
      </div>

      <div class="row h-100 position-relative z-1 align-items-center">
        <div class="col-12 col-lg-5 col-xl-5 mb-4 mb-lg-0 d-flex justify-content-center justify-content-lg-start">
          <div class="d-flex flex-column flex-lg-row gap-3 gap-lg-4">
            <a
              href="/src/front/pages/catalogo.html"
              class="btn btn-lg fw-bold shadow-lg py-3 px-4 fs-5 text-white"
              style="background: linear-gradient(90deg, #A21CAF, #4FD1E8); border: none; min-width: 210px;"
            >
              VER CATÁLOGO
            </a>

            <a
              href="/src/front/pages/registro.html"
              class="btn btn-lg fw-bold shadow-lg py-3 px-4 fs-5 text-white"
              style="background: linear-gradient(90deg, #A21CAF, #4FD1E8); border: none; min-width: 210px;"
            >
              REGISTRARSE
            </a>
          </div>
        </div>

        <div class="col-12 col-lg-7 col-xl-7 text-center text-lg-end">
          <h1 class="display-4 fw-bold mb-3 lh-1" style="text-shadow: 0 4px 25px rgba(0,0,0,0.7);">
            Compra fácil,<br>segura y rápida
          </h1>

          <p class="lead fs-5 opacity-90 mb-0" style="max-width: 950px; margin-left: auto; margin-right: auto;">
            Productos por categorías, búsqueda avanzada y<br>pago simulado
          </p>
        </div>
      </div>
    </div>
  </section>

  <!-- FILTROS -->
  <section class="container-fluid px-3 px-lg-5 mb-4">
    <div class="inicio-filtros-panel">
      <div class="d-flex flex-column gap-4">

        <div>
          <h2 class="inicio-panel-title mb-3">Categorías</h2>
          <div
            class="row g-3 justify-content-center justify-content-lg-start"
            id="filtros-categorias"
          ></div>
        </div>

        <div>
          <h2 class="inicio-panel-title mb-3">Plataformas</h2>
          <div
            class="row g-3 justify-content-center justify-content-lg-start"
            id="filtros-plataformas"
          ></div>
        </div>

        <div class="d-flex justify-content-center justify-content-lg-end">
          <input
            type="search"
            id="busqueda-productos"
            class="form-control inicio-search"
            placeholder="Buscar producto..."
          >
        </div>
      </div>
    </div>
  </section>

  <!-- PRODUCTOS -->
  <section class="container-fluid px-3 px-lg-5 mb-5">
    <div class="inicio-productos-panel">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <h2 class="inicio-panel-title mb-0">Productos disponibles</h2>
        <div id="inicio-resumen-productos" class="fw-semibold"></div>
      </div>

      <div class="productos-carousel-wrap">
        <button class="carousel-arrow carousel-arrow--left" id="productos-left" type="button">
          ‹
        </button>

        <div id="productos-filtrados" class="productos-carousel"></div>

        <button class="carousel-arrow carousel-arrow--right" id="productos-right" type="button">
          ›
        </button>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <!-- MODAL DETALLE -->
  <div class="modal fade" id="productoDetalleModal" tabindex="-1" aria-labelledby="productoDetalleLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 rounded-4 overflow-hidden">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="productoDetalleLabel">Detalle del producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body" id="productoDetalleBody">
          <div class="text-center py-4">Cargando detalle...</div>
        </div>
      </div>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</body>
</html>
