<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />

  <!-- CSS del proyecto -->
  <link rel="stylesheet" href="../css/main.css" />

  <title>Carrito | 4Bit</title>

  <!-- JS del proyecto -->
  <script src="../js/main.js" defer></script>
  <script type="module" src="../js/carrito.js" defer></script>
</head>

<body>

  <!-- Header dinámico -->
  <div id="header"></div>

  <!-- CONTENEDOR CARRITO -->
  <div class="cart-page">
    <div class="cart-modal-box">

      <section class="cart-panel">

        <!-- HEADER DEL CARRITO -->
        <div class="cart-header">
          <div class="cart-header__brand">
            <img src="/assets/Logo_4bit.webp" alt="Logo tienda">
          </div>

          <h2>Carrito de Compras</h2>

          <button class="cart-close btn-ghost" aria-label="Cerrar">
            ✕
          </button>
        </div>

        <!-- GRID PRINCIPAL -->
        <div class="cart-grid">

          <!-- IZQUIERDA: PRODUCTOS -->
          <section class="cart-list">
            <div class="title">Productos</div>

            <!-- Aquí JS renderiza productos -->
            <div id="cart-items"></div>

          </section>

          <!-- DERECHA: RESUMEN -->
          <aside class="cart-summary">

            <div class="summary-box">

              <div class="section-title">
                Resumen del Pedido
              </div>

              <!-- Totales generados por JS -->
              <div class="totals" id="cart-totals">

                <div class="row">
                  <span>Subtotal</span>
                  <span>₡0.00</span>
                </div>

                <div class="row muted">
                  <span>Envío</span>
                  <span>Calculado en el pago.</span>
                </div>

                <div class="row total">
                  <span>Total</span>
                  <span>₡0.00</span>
                </div>

              </div>

              <!-- BOTÓN CONFIRMAR -->
              <button class="btn-grad-secondary cart-confirm">
                Confirmar
              </button>

              <!-- SEGURIDAD -->
              <div class="cart-secure">
                <span>🛡 Compra 100% protegida</span>
              </div>

              <!-- MÉTODOS DE PAGO -->
              <div class="cart-payments">
                <img src="/assets/visa.png" alt="Visa">
                <img src="/assets/mastercard.png" alt="Mastercard">
              </div>

            </div>

          </aside>

        </div>
      </section>

    </div>
  </div>

  <!-- Footer dinámico -->
  <div id="footer"></div>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>

</body>
</html>
