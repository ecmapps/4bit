<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="../css/main.css" />
  <title>Mis Pedidos | 4Bit</title>
  <script src="../js/main.js" defer></script>
  <script type="module" src="../js/pedidos.js" defer></script>
</head>

<body>
  <div id="header"></div>
  <div id="carrito"></div>

  <div class="page-pedidos">
    <div class="searchbar">
      <input id="searchPedidos" class="search" type="search" placeholder="Buscar" />
    </div>

    <main class="pedidos-grid">
      <!-- IZQUIERDA: LISTA -->
      <section class="pedidos-list">
        <div class="title">Mis Compras</div>
        <div id="pedidos-lista"></div>
      </section>

      <!-- DERECHA: DETALLE -->
      <section class="pedido-detail" id="pedido-detail">
        <div class="header">
          <h2>Pedido #00000</h2>
        </div>

        <div class="detail-meta">
          <span class="date">Fecha: --/--/----</span>
          <span class="badge-activo">ACTIVO</span>
        </div>

        <div class="steps">
          <div class="step done">
            <div class="dot">✓</div>
            Pago realizado
          </div>
          <div class="step done">
            <div class="dot">✓</div>
            Confirmado
          </div>
          <div class="step done">
            <div class="dot">✓</div>
            Licencia generada
          </div>
          <div class="step done">
            <div class="dot">✓</div>
            Acceso activado
          </div>
        </div>

        <div class="box">
          <div class="section-title">Detalle del Pedido</div>
          <div id="pedido-items"></div>

          <div class="totals" id="pedido-totals">
            <div class="row">
              <span>Subtotal</span>
              <span>0 CRC</span>
            </div>
            <div class="row muted">
              <span>Envío</span>
              <span>Calculado en el pago.</span>
            </div>
            <div class="row total">
              <span>Total</span>
              <span>0 CRC</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="footer"></div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</body>
</html>
