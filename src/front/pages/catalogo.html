<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Inicio 4Bit</title>
    <script src="../js/main.js" defer></script>
</head>
<body>
    <div id="header"></div>
    <div id="carrito"></div>

    <div class="">
        <section class="container-fluid">
            <h1 class="text-center d-none d-xl-block mb-3">Catalogo de Productos</h1>
            <div class="row justify-content-center">
                <!-- Sidebar con filtros -->
                <nav id="sidebar"
                class="col-xl-3 col-xxl-2 d-lg-block text-light sidebar p-3">
                    <div class="position-sticky pt-3">

                    <h5 class="mb-3 px-3 fs-4 fw-bold">Filtros</h5>

                    
                    <div class="mb-4 px-3">
                        <h6 id="categorias">Categorias</h6>
                        <script type="module" defer>
                            import { Productos } from '/src/front/js/productos.js';
                            const categoriasDiv = document.getElementById('categorias');
                            const categorias = [];
                            Productos().then(data=>{
                                data.productos.forEach(producto=>{
                                    if((categorias.includes(producto.categoria))) return;
                                    const categoria = document.createElement('div',{className:'form-check'});
                                    categoria.innerHTML = `
                                    <input class="form-check-input" type="checkbox" id=${producto.categoria}>
                                    <label class="form-check-label" for=${producto.categoria}>${producto.categoria}</label>`;
                                    categoriasDiv.appendChild(categoria);
                                    categorias.push(producto.categoria);
                                })
                            })
                        </script>
                    </div>
                    
                    <div class="mb-4 px-3">
                        <h6 class="fw-bold">Plataformas</h6>
                        <div class="btn-group flex-wrap gap-2" role="group" id="plataformas">
                            <script type="module" defer>
                                import { Productos } from '/src/front/js/productos.js';
                                const plataformasDiv = document.getElementById('plataformas');
                                const plataformas = [];
                                Productos().then(data=>{
                                    data.productos.forEach(producto=>{
                                        producto.sistema_operativo.forEach(sistema => {
                                            console.log(sistema);
                                            if(plataformas.includes(sistema)) return;
                                            const plataforma = document.createElement('div',{className:'form-check'});
                                            plataforma.innerHTML = `
                                            <input type="checkbox" class="btn-check" id=${sistema} autocomplete="off">
                                            <label class="btn btn-outline-secondary btn-sm" for=${sistema}>${sistema}</label>`;
                                            plataformasDiv.appendChild(plataforma);
                                            plataformas.push(sistema);
                                        });
                                    })
                                })
                            </script>
                        </div>
                    </div>
                    
                    <!-- Filtros de ejemplo -->
                    <div class="mb-4 px-3">
                        <h6>Precio</h6>
                        <input type="range" class="form-range" min="0" max="1000" step="10">
                    </div>
                    <div class="d-grid px-3">
                        <button class="btn btn-primary">Aplicar filtros</button>
                    </div>

                    </div>
                </nav>
                <!-- Titulo below xl -->
                <h1 class="d-block d-xl-none text-center my-3">Catalogo de Productos</h1>
                <!-- Catalogo aqui -->
                <div id="catalogo" class="col-12 col-xl-9 col-xxl-10 d-flex flex-wrap gap-4 justify-content-center mb-4">
                    <script type="module" defer>
                        import { Productos } from '/src/front/js/productos.js';
                        const catalogoDiv = document.getElementById('catalogo');
                        const catalogo = document.getElementById('catalogo');
                        Productos().then(data=>{
                            data.productos.forEach(producto => {
                                const elemento = document.createElement('div');
                                elemento.innerHTML = `
                                    <div class="card h-100 shadow p-2">
                                        <img src="${producto.imagen}" class="card-img-top rounded align-self-center" alt="${producto.nombre}">
                                        <div class="card-body justify-content-start d-flex flex-column">
                                            <div class="card-title fs-4 fw-bold">${producto.nombre}</div>
                                            <p class="card-text">Precio: ${producto.precio} CRC</p>
                                            <p class="card-text">Plataforma: ${Array.isArray(producto.sistema_operativo) ? producto.sistema_operativo.join(', ') : producto.sistema_operativo}</p>
                                            <a href="#" class="btn btn-warning mt-auto">Agregar al carrito</a> 
                                        </div>
                                    </div>`;
                                catalogo.appendChild(elemento);
                            });
                        })
                    </script>
                </div>
            </div>
        </section>
    </div>


    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
