<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Inicio 4Bit</title>
    <script src="../js/main.js" defer></script>
</head>
<body>
    <div id="header"></div>
    <div id="carrito"></div>

    <div>
        <h1 class="text-center my-4">Catálogo de Productos</h1>
        <div id="catalogo" class="row row-cols-1 row-cols-md-3 g-4">
            <!-- Aquí se cargarán los productos dinámicamente -->
            <script type="module" defer>
                import { Productos } from '/src/front/js/productos.js';
                const catalogoDiv = document.getElementById('catalogo');
                const catalogo = document.getElementById('catalogo');
                Productos().then(data=>{
                    data.productos.forEach(producto => {
                        const elemento = document.createElement('div');
                        elemento.innerHTML = `
                            <strong>${producto.nombre}</strong><br>
                            Precio: ${producto.precio} CRC<br>
                            Plataforma: ${Array.isArray(producto.sistema_operativo) ? producto.sistema_operativo.join(', ') : producto.sistema_operativo}`;
                        catalogo.appendChild(elemento);
                    });
                })
            </script>
        </div>
    </div>


    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
