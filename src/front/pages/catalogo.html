<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/src/front/css/main.css">

  <title>Catálogo | 4Bit</title>

  <script type="module" src="/src/front/js/main.js"></script>
  <script type="module" src="/src/front/js/catalogo.js"></script>
</head>
<body>
  <div id="header-store"></div>
  <div id="carrito"></div>

  <section class="container-fluid py-4">
    <h1 class="text-center d-none d-xl-block mb-4">Catálogo de Productos</h1>

    <div class="row justify-content-center">
      <nav id="sidebar" class="col-xl-3 col-xxl-2 d-lg-block text-light sidebar p-3 rounded-4">
        <div class="position-sticky pt-3">
          <h5 class="mb-3 px-3 fs-4 fw-bold">Filtros</h5>

          <div class="mb-4 px-3">
            <h6 class="fw-bold">Categorías</h6>
            <div id="categorias" class="d-flex flex-column gap-2"></div>
          </div>

          <div class="mb-4 px-3">
            <h6 class="fw-bold">Plataformas</h6>
            <div class="btn-group flex-wrap gap-2" role="group" id="plataformas"></div>
          </div>

          <div class="mb-4 px-3">
            <h6 class="fw-bold">Precio máximo</h6>
            <input
              type="range"
              class="form-range"
              min="0"
              max="500000"
              step="1000"
              id="precio-range"
              value="500000">
            <div class="small mt-2" id="precio-value">Hasta: ₡500,000</div>
          </div>

          <div class="d-grid gap-2 px-3">
            <button class="btn btn-primary" id="btn-aplicar-filtros" type="button">
              Aplicar filtros
            </button>
            <button class="btn btn-outline-light" id="btn-limpiar-filtros" type="button">
              Limpiar filtros
            </button>
          </div>
        </div>
      </nav>

      <h1 class="d-block d-xl-none text-center my-3">Catálogo de Productos</h1>

      <div class="col-12 col-xl-9 col-xxl-10">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4 px-2">
          <div id="catalogo-resumen" class="fw-semibold"></div>

          <div>
            <select id="ordenar-productos" class="form-select">
              <option value="default">Ordenar por</option>
              <option value="precio-asc">Precio: menor a mayor</option>
              <option value="precio-desc">Precio: mayor a menor</option>
              <option value="nombre-asc">Nombre: A-Z</option>
              <option value="nombre-desc">Nombre: Z-A</option>
            </select>
          </div>
        </div>

        <div id="catalogo" class="d-flex flex-wrap gap-4 justify-content-center mb-4"></div>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
